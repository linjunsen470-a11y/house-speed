# =============================================================================
# 房产带看视频 · 自动变速剪辑配置
# 原则：不删除任何片段；房间实景原速；转角/空墙/过渡加速
# 用法：python edit_speed.py 2.mp4
#       python edit_speed.py 2.mp4 -c config.yaml -o out.mp4
# =============================================================================

# --- 输入输出 -----------------------------------------------------------------
io:
  # 未指定 -o 时的输出命名：{stem}_edited.mp4
  output_suffix: "_edited"
  # 中间产物目录：frames/<stem>-<sha1前8位>/（旧的 frames/<stem>/ 为遗留路径）
  work_dir: "frames"
  # 是否写出 motion.csv / segments.json / filter_complex.txt
  save_motion_csv: true
  save_segments_json: true
  save_filter_script: true

cache:
  enabled: true

# --- 运动 / 结构分析 -----------------------------------------------------------
analysis:
  # 分析前缩放到该宽度（高度按比例），越小越快
  resize_width: 135
  resize_height: 240
  # Canny 边缘检测阈值（结构密度）
  canny_low: 50
  canny_high: 150
  # 指标时间平滑窗口（帧数，建议奇数）。越大越稳，但短转角更易被抹平
  smooth_window: 7

# --- 分类阈值（决定 room / move / fast）---------------------------------------
# 双门控：
#   高结构（客厅/卧室/外景）→ 禁止 fast，保护扫景不甩镜
#   中结构 + 持续行走 → move/fast，过道不再拖成 1×
#   低结构急动 / 空墙 → fast ≥ 3.0×
# 优先级大致为：
#   纯空墙 wall → fast
#   edge ≥ content_struct_min → room（有内容保护）
#   高 motion + 低结构 → fast（真 dash）
#   中结构持续 walk → move 或 fast（过道）
#   transitional 兜底 → move
#   其余 → room
classify:
  # 低信息平面（任意颜色墙/门板）：以 edge 为主，不要求“白”或低 std
  # edge < wall_edge_max → 直接 fast（阴影/漆面颗粒会抬高 std，旧逻辑会漏）
  # edge 略高但仍低且 std 低 → 软判定 flat
  wall_edge_max: 0.035
  wall_std_max: 45.0
  flat_edge_soft: 0.049          # ≈ wall_edge_max * 1.4
  flat_promote_edge_max: 0.040   # 段级：整段 mean edge 仍低则 room→fast

  # 急转 / 快速穿行：平滑后的帧差均值（须同时结构低才进 fast）
  very_fast_motion: 15.0

  # 过渡行走兜底（已放宽 edge，真正过道主要靠 corridor_*）
  transitional_motion: 9.0
  transitional_edge_max: 0.090

  # 有内容保护：室内家具/外景扫景 edge 达到此值 → 永不 3×
  content_struct_min: 0.115
  # 仅当结构低于此值时，高 motion 才判 dash→fast
  dash_struct_max: 0.055

  # 过道带：中等结构 + 持续中等以上运动
  walk_motion_lo: 6.5
  walk_motion_hi: 14.0
  corridor_struct_lo: 0.040
  corridor_struct_hi: 0.110
  corridor_sustain_sec: 0.8
  corridor_sustain_ratio: 0.65
  corridor_fast_motion: 12.0   # 过道内再升到 fast
  move_struct_max: 0.090

  # 兼容旧字段（外景保护；主保护阈值已是 content_struct_min）
  scenic_edge_min: 0.16

# --- 各类速度倍率（>1 为加速；1 为原速）---------------------------------------
# 注意：不会丢弃任何时间段，只改变播放速度
speeds:
  room: 1.0    # 客厅 / 房间等有意义画面
  move: 2.2    # 走廊过渡行走
  fast: 3.0    # 转角 / 空墙 / 急转 / 快过道（最低 3×）

# --- 分段后处理 ---------------------------------------------------------------
segments:
  # 短于该秒数的「孤岛」并入相邻段，减少闪切
  min_duration: 0.45
  # 非空墙的短 fast 并入邻段（抑制 1×↔3× 闪切）
  min_fast_duration: 0.9
  # room—短 fast—room 且两侧高结构 → 否决为 room（客厅误伤）
  sandwich_demote_fast_max: 2.5
  sandwich_demote_need_high_struct: true
  # 长中结构 room + 持续行走 → 提升为 move/fast（过道漏判）
  corridor_promote_min_sec: 1.2

# --- 方案 A：实景停留衰减（room hold ramp）-------------------------------------
# 连续 room 段内按「已停留时长」分段提速，压缩同一空间过久停留，仍不删帧。
# after = 相对该 room 段起点的秒数；speed = 该区间播放倍率。
# 高结构 / 相机仍在动的片段跳过衰减，避免扫景后半段被抬速甩镜。
pacing:
  enabled: true
  scenic_skip_hold_ramp: true
  scenic_skip_edge_min: 0.115
  static_hold_motion_max: 7.0
  room_hold_ramp:
    - after: 0.0
      speed: 1.0    # 前几秒建立空间感
    - after: 4.0
      speed: 1.5    # 开始轻压拖沓
    - after: 7.0
      speed: 2.0
    - after: 10.0
      speed: 2.8    # 长时间重复信息强压

# --- 人工覆盖（可选）-----------------------------------------------------------
# 在自动分段之后，按时间强制指定 kind（room|move|fast）。
# 重叠时后写覆盖先写。适合「某几秒必须原速/必须加速」。
# overrides:
#   - start: 10.0
#     end: 12.5
#     kind: room
#   - start: 20.0
#     end: 22.0
#     kind: fast
overrides: []

# --- 编码导出 -----------------------------------------------------------------
# 变速必须重编码，无法 stream copy。
# 旧默认 libx264 + crf 20 会把微信/HEVC 低码率片压成 2～4 倍体积——不是剪辑逻辑错。
encode:
  # true：按原片视频/音频码率重编码（原片 HEVC → libx265），成片通常更短也更小
  match_source: true
  # 相对原片视频码率的倍率（0.9 更小；1.2 略清晰）
  bitrate_scale: 1.0
  # match_source 时 video_codec 建议 auto（跟原片）；可强制 libx264 / libx265
  video_codec: "auto"
  preset: "medium"
  pixel_format: "yuv420p"
  audio_codec: "aac"
  # 仅当 match_source: false 时使用 CRF 模式
  crf: 28
  audio_bitrate: "64k"
  movflags: "+faststart"

review:
  width: 540
  fps: 12
  video_bitrate: "900k"
  preset: "ultrafast"
  # drawtext 字体（Windows 建议 arial.ttf / msyh.ttc）；留空则自动探测
  # fontfile: "C:/Windows/Fonts/arial.ttf"
  fontfile: ""

# --- 成片包装（短视频花字 + 私信贴纸 + 仅 BGM）------------------------------
# 用法：python edit_speed.py 素材.mp4 --pack
# 列出样式：python edit_speed.py --list-styles
pack:
  enabled: false
  assets_dir: "assets"
  # 花字：douyin_estate（标题/卖点/价格三级）| douyin_fire | douyin_pink | …
  style: "douyin_estate"
  fontfile: ""
  text:
    title: ""
    highlights: []
    price: ""
    # 兼容旧写法：lines 首行=title，末行=price，中间=highlights
    lines: []
  layout:
    y_rel: 0.255         # 花字块中心上下（偏上安全区）
    max_width_rel: 0.88
    highlights_mode: "join"  # join=「A · B」一行 | stack=卖点分行
    # font_size_rel / line_gap_rel / sparkle 可选
  text_motion:
    enter: "fade"        # none | fade | pop（默认淡入）
    duration: 0.35
    bounce_px: 0         # 关闭文字跳动
    bounce_period: 1.4
    pulse: 0             # 关闭透明度抖动
    pulse_period: 2.0
    sparkle_anim: true   # 价格旁星星闪烁（APNG）
    sparkle_fps: 10
    sparkle_frames: 10
  sticker:
    enabled: true
    # 锁定默认：暖橙花字+星光。同结构换色：
    # dm_estate_cta_gold | _sky | _mint | _violet | _snow | _heart | _fire
    style: "dm_estate_cta"
    text: "私信了解"         # 私 / 私信 / 私信我 / 私信了解
    start: 4.5               # 首窗开始秒
    duration: 2.5            # 首窗时长 → 默认 4.5–7.0s
    repeat_at_end: true      # 片尾再出一次
    end_lead: 2.8            # 片尾窗长度（秒）
    width_rel: 0.30
    x: 0.16
    y: 0.90
    file: ""                 # 自备透明 APNG/GIF 时填路径（忽略绘制）
    enter: "slide_up"        # none | pop | slide_up
    enter_ms: 280
    fps: 12
  audio:
    # 默认 curated：pop_hook | pop_spark | pop_vibe | pop_soft | pop_drive | pop_clean
    # 短名单：sl01…sl12 或 shortlist/01.mp3
    # 本地库：a1…a18（缺号自动跳过）| random = 优先 curated
    bgm: "pop_hook"
    volume: 0.80
    fade_in: 0.5
    fade_out: 0.8


