# =============================================================================
# 房产带看视频 · 自动变速剪辑配置
# 原则：不删除任何片段；房间实景原速；转角/空墙/过渡加速
# 用法：python edit_speed.py 2.mp4
#       python edit_speed.py 2.mp4 -c config.yaml -o out.mp4
# =============================================================================

# --- 输入输出 -----------------------------------------------------------------
io:
  # 未指定 -o 时的输出命名：{stem}_edited.mp4
  output_suffix: "_edited"
  # 中间产物目录：frames/<stem>-<sha1前8位>/（旧的 frames/<stem>/ 为遗留路径）
  work_dir: "frames"
  # 是否写出 motion.csv / segments.json / filter_complex.txt
  save_motion_csv: true
  save_segments_json: true
  save_filter_script: true

cache:
  enabled: true

# --- 运动 / 结构分析 -----------------------------------------------------------
analysis:
  # 分析前缩放到该宽度（高度按比例），越小越快
  resize_width: 135
  resize_height: 240
  # Canny 边缘检测阈值（结构密度）
  canny_low: 50
  canny_high: 150
  # 指标时间平滑窗口（帧数，建议奇数）。越大越稳，但短转角更易被抹平
  smooth_window: 7

# --- 分类阈值（决定 room / move / fast）---------------------------------------
# 优先级大致为：
#   纯空墙 wall → fast
#   高速但结构丰富（阳台外景扫景）→ room（保护，不按 fast）
#   高速且结构弱 → fast
#   transitional → move
#   其余 → room
classify:
  # 白墙 / 门板 / 过曝空镜：边缘少 + 对比度低
  wall_edge_max: 0.035
  wall_std_max: 45.0

  # 急转 / 快速穿行：平滑后的帧差均值
  very_fast_motion: 14.0

  # 过渡行走：运动偏大且结构偏弱（房间内缓推通常 edge 较高，不会进这里）
  transitional_motion: 10.5
  transitional_edge_max: 0.055

  # 风景/外景保护：运动再大，只要边缘密度够高（楼群、树、天际线），
  # 视为有意义扫景，保持 room，避免阳台外景被 3.5× 快进。
  # 阈值宜高于一般室内（室内家具 edge 常在 0.05～0.14）
  scenic_edge_min: 0.16

# --- 各类速度倍率（>1 为加速；1 为原速）---------------------------------------
# 注意：不会丢弃任何时间段，只改变播放速度
speeds:
  room: 1.0    # 客厅 / 房间等有意义画面
  move: 2.2    # 走廊过渡行走
  fast: 3.5    # 转角 / 空墙 / 急转

# --- 分段后处理 ---------------------------------------------------------------
segments:
  # 短于该秒数的「孤岛」并入相邻段，减少闪切
  min_duration: 0.40

# --- 方案 A：实景停留衰减（room hold ramp）-------------------------------------
# 连续 room 段内按「已停留时长」分段提速，压缩同一空间过久停留，仍不删帧。
# after = 相对该 room 段起点的秒数；speed = 该区间播放倍率。
pacing:
  enabled: true
  # 子段平均边缘 ≥ 该值时跳过停留衰减（可比 scenic_edge_min 略高，避免室内误免衰减）
  scenic_skip_hold_ramp: true
  scenic_skip_edge_min: 0.18
  room_hold_ramp:
    - after: 0.0
      speed: 1.0    # 前几秒建立空间感
    - after: 4.0
      speed: 1.5    # 开始轻压拖沓
    - after: 7.0
      speed: 2.0
    - after: 10.0
      speed: 2.8    # 长时间重复信息强压

# --- 人工覆盖（可选）-----------------------------------------------------------
# 在自动分段之后，按时间强制指定 kind（room|move|fast）。
# 重叠时后写覆盖先写。适合「某几秒必须原速/必须加速」。
# overrides:
#   - start: 10.0
#     end: 12.5
#     kind: room
#   - start: 20.0
#     end: 22.0
#     kind: fast
overrides: []

# --- 编码导出 -----------------------------------------------------------------
# 变速必须重编码，无法 stream copy。
# 旧默认 libx264 + crf 20 会把微信/HEVC 低码率片压成 2～4 倍体积——不是剪辑逻辑错。
encode:
  # true：按原片视频/音频码率重编码（原片 HEVC → libx265），成片通常更短也更小
  match_source: true
  # 相对原片视频码率的倍率（0.9 更小；1.2 略清晰）
  bitrate_scale: 1.0
  # match_source 时 video_codec 建议 auto（跟原片）；可强制 libx264 / libx265
  video_codec: "auto"
  preset: "medium"
  pixel_format: "yuv420p"
  audio_codec: "aac"
  # 仅当 match_source: false 时使用 CRF 模式
  crf: 28
  audio_bitrate: "64k"
  movflags: "+faststart"

review:
  width: 540
  fps: 12
  video_bitrate: "900k"
  preset: "ultrafast"
  # drawtext 字体（Windows 建议 arial.ttf / msyh.ttc）；留空则自动探测
  # fontfile: "C:/Windows/Fonts/arial.ttf"
  fontfile: ""

# --- 成片包装（短视频花字 + 私信贴纸 + 仅 BGM）------------------------------
# 用法：python edit_speed.py 素材.mp4 --pack
# 列出样式：python edit_speed.py --list-styles
pack:
  enabled: false
  assets_dir: "assets"
  # 花字（多层描边，非字幕条）：
  #   douyin_fire | douyin_pink | douyin_lemon | douyin_mint |
  #   douyin_gold | douyin_violet | douyin_sky | douyin_candy
  style: "douyin_fire"
  fontfile: ""
  text:
    # 推荐用 lines（最多 5 行），也兼容 line1..line4
    lines: []
    # line1: "绿湖全新未入住"
    # line2: "101平三房"
    # line3: "业主忍痛割爱"
    # line4: "单价5XXX"
  layout:
    y_rel: 0.30          # 花字块中心：0=顶 1=底（0.30≈偏上）
    max_width_rel: 0.90  # 花字最大宽度占画面宽
    # font_size_rel: 0.082  # 可选：覆盖样式默认字号（相对画面短边）
    # line_gap_rel: -0.006  # 可选：行距；0更紧，负值再贴紧（描边留白重叠）
  sticker:
    enabled: true
    # dm_emoji_bubble | dm_emoji_heart | dm_emoji_mail | dm_emoji_point
    # | dm_follow_me | dm_pink_wave | dm_chat_pop | dm_heart_tap | dm_bell_cute | dm_hand_cute
    style: "dm_emoji_bubble"
    start: 5.0
    width_rel: 0.30      # 贴纸宽度占画面宽（越大贴纸越大）
    x: 0.16              # 贴纸中心水平：0=左 0.5=中 1=右
    y: 0.90              # 贴纸中心垂直：0=顶 1=底
    file: ""             # 自备透明 APNG/GIF/WebM 时填路径
  audio:
    # 内置：carefree | easy_lemon | life_of_riley | summer_day | dreamlike | bittersweet | random
    # 或路径：assets/music/xxx.mp3（见 assets/music/README.md，CC BY 署名）
    bgm: "carefree"
    volume: 0.80
    fade_in: 0.5
    fade_out: 0.8


