# Copy to <video-stem>.edit.yaml, then run: python edit_speed.py video.mp4 --pack

pack:
  style: "douyin_estate"
  text:
    title: "\u7eff\u6e56\u5168\u65b0\u672a\u5165\u4f4f"
    highlights:
      - "101\u5e73\u4e09\u623f"
      - "\u4e1a\u4e3b\u5fcd\u75db\u5272\u7231"
    price: "\u5355\u4ef75XXX"
  layout:
    y_rel: 0.255
    max_width_rel: 0.88
    highlights_mode: "join"  # 或 stack
  text_motion:
    enter: "fade"
    duration: 0.35
    bounce_px: 0
    pulse: 0
    sparkle_anim: true
  sticker:
    # 锁定默认 warm；换色见 assets/README.md（_gold _sky _ink _neon …）
    style: "dm_estate_cta"
    text: "私信了解"         # 或 私 / 私信 / 私信我
    start: 4.5
    duration: 2.5
    repeat_at_end: true
    end_lead: 2.8
    width_rel: 0.30
    x: 0.16
    y: 0.90
    enter: "slide_up"
    enter_ms: 280
  audio:
    bgm: "pop_hook"          # 或 sl01 / a3 / random / shortlist/01.mp3
    volume: 0.80
